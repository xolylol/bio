<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>waslise aka xoly</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #e5e5e5; }
        ::-webkit-scrollbar-thumb { background: #a1a1aa; border-radius: 2px; }

        body {
            background-color: #111113;
            color: #18181b;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        /* Зернистость (Grain / Noise Overlay) */
        .noise-overlay {
            position: fixed; inset: 0;
            pointer-events: none; z-index: 50; opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* ЭФФЕКТЫ ФОНА */
        .bg-container {
            position: fixed; inset: 0;
            z-index: -2; pointer-events: none;
            overflow: hidden;
        }

        .bg-image {
            position: absolute; inset: -10%;
            width: 120%; height: 120%;
            background-image: url('https://i.pinimg.com/736x/b5/e3/f0/b5e3f0cec8120d90befe86d0e74fc684.jpg');
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) blur(8px) contrast(110%) brightness(85%);
            animation: bgZoom 25s ease-in-out infinite alternate;
        }

        @keyframes bgZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* Виньетка (затемнение по краям) */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 20%, rgba(0, 0, 0, 0.75) 100%);
            z-index: -1; pointer-events: none;
        }

        @keyframes borderGlow {
            0%, 100% { 
                border-color: rgba(255, 255, 255, 0.9);
                box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 1);
            }
            50% { 
                border-color: rgba(0, 0, 0, 0.2);
                box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 1);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.76);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.25),
                        inset 0 1px 0 rgba(255, 255, 255, 0.95);
            transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            animation: borderGlow 5s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.05), transparent 70%);
            border-radius: 50%;
            pointer-events: none; opacity: 0;
            transition: opacity 0.4s ease;
            transform: translate(-50%, -50%);
            left: var(--mouse-x, 50%); top: var(--mouse-y, 50%);
            z-index: 0;
        }

        .glass-card:hover::before { opacity: 1; }

        .glass-card:hover {
            border-color: rgba(0, 0, 0, 0.3);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.35),
                        inset 0 1px 0 rgba(255, 255, 255, 1);
            transform: translateY(-3px);
        }

        .glass-card > * { position: relative; z-index: 1; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-card {
            animation: slideUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        .animate-card:nth-child(1) { animation-delay: 0.1s; }
        .animate-card:nth-child(2) { animation-delay: 0.3s; }
        .animate-card:nth-child(3) { animation-delay: 0.5s; }

        .nickname-badge {
            background: rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.12);
            padding: 6px 14px;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            position: relative;
            overflow: hidden;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            max-width: 100%;
        }

        .nickname-badge::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.8) 50%, transparent 100%);
            transform: skewX(-20deg);
            pointer-events: none;
            transition: left 0.75s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .nickname-badge:hover::after { left: 150%; }

        .nickname-badge:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(0, 0, 0, 1);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .nickname-badge:hover #nickname-text { color: #ffffff; }

        .nickname-badge:hover .aka-text {
            color: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .social-btn {
            background: rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.12);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
            color: #18181b;
        }
        .social-btn::before {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1), transparent 70%);
            opacity: 0; transition: opacity 0.35s ease;
        }
        .social-btn:hover::before { opacity: 1; }
        .social-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(0, 0, 0, 1);
            transform: translateY(-4px) scale(1.1);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .social-btn i { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .social-btn:hover i { transform: scale(1.2) rotate(-6deg); }

        .badge-tag {
            background: rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.12);
            color: #18181b;
            font-size: 10px; font-weight: 500;
            padding: 3px 10px;
            border-radius: 9999px;
            font-family: 'JetBrains Mono', monospace;
            display: inline-flex; align-items: center;
            letter-spacing: 0.03em;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }
        .badge-tag::after {
            content: ''; position: absolute; top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.7) 50%, transparent 100%);
            transform: skewX(-20deg);
            pointer-events: none;
            transition: left 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .badge-tag:hover::after { left: 150%; }
        .badge-tag:nth-child(1) { animation-delay: 0.6s; }
        .badge-tag:nth-child(2) { animation-delay: 0.75s; }
        .badge-tag:nth-child(3) { animation-delay: 0.9s; }

        .badge-tag:hover {
            background: rgba(0, 0, 0, 0.9);
            border-color: rgba(0, 0, 0, 1);
            color: #ffffff;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
        }
        .badge-tag:hover i { color: #ffffff !important; }

        .cursor::after {
            content: '▌';
            animation: blink 0.8s infinite;
            color: rgba(0, 0, 0, 0.8);
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #splash-screen {
            background-color: #0d0d0f;
            color: #ffffff;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            z-index: 100;
        }
        #splash-screen.fade-out {
            opacity: 0; visibility: hidden; pointer-events: none;
        }

        #toast {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        }

        .custom-slider {
            -webkit-appearance: none; appearance: none;
            width: 100%; height: 4px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 2px; outline: none;
        }
        .custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 12px; height: 12px; border-radius: 50%;
            background: #18181b;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }
        .custom-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }

        .avatar-glow {
            position: relative;
            animation: avatarFloat 6s ease-in-out infinite;
        }
        .avatar-glow::after {
            content: ''; position: absolute; inset: -4px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,0,0,0.15), transparent 70%);
            animation: avatarPulse 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes avatarFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .click-spark {
            position: fixed;
            width: 4px; height: 4px;
            background: #18181b; border-radius: 50%;
            pointer-events: none; z-index: 9999;
            animation: sparkFade 0.8s ease-out forwards;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
        }
        @keyframes sparkFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0) translateY(-30px); opacity: 0; }
        }

        .nickname-typing::after {
            content: '▌';
            animation: blink 0.8s infinite;
            margin-left: 1px;
            font-size: 10px;
        }

        .cover-wrapper {
            position: relative;
            width: 40px; height: 40px;
            flex-shrink: 0;
        }

        .cover-wrapper .cover-img {
            width: 100%; height: 100%;
            border-radius: 8px;
            object-fit: cover;
            display: block;
        }

        .cover-ring {
            position: absolute;
            inset: -3px;
            width: calc(100% + 6px);
            height: calc(100% + 6px);
            pointer-events: none;
            transform: rotate(-90deg);
            overflow: visible;
        }

        .cover-ring .ring-track {
            fill: none;
            stroke: rgba(0, 0, 0, 0.1);
            stroke-width: 1.5;
        }

        .cover-ring .ring-progress {
            fill: none;
            stroke: #18181b;
            stroke-width: 1.5;
            stroke-linecap: round;
            filter: drop-shadow(0 0 2px rgba(0, 0, 0, 0.3));
            transition: stroke-dashoffset 0.15s linear;
        }

        .discord-status-badge {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .discord-status-badge svg {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .discord-status-badge svg.fade-in {
            animation: statusFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes statusFadeIn {
            0% { opacity: 0; transform: scale(0.6); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>

    <script>
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                card.style.setProperty('--mouse-x', (e.clientX - rect.left) + 'px');
                card.style.setProperty('--mouse-y', (e.clientY - rect.top) + 'px');
            });
        });

        document.addEventListener('pointerdown', (e) => {
            if (e.target.closest('button, a, input')) return;
            for (let i = 0; i < 6; i++) {
                const spark = document.createElement('div');
                spark.className = 'click-spark';
                const angle = (Math.PI * 2 * i) / 6;
                const distance = 20 + Math.random() * 25;
                spark.style.left = e.clientX + 'px';
                spark.style.top = e.clientY + 'px';
                spark.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                spark.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 800);
            }
        });

        let audioCtx = null;
        document.addEventListener('pointerdown', () => {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.value = 800 + Math.random() * 400;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        });

        const nicknameText = "waslise";
        let nickIndex = 0;
        const nicknameEl = document.getElementById('nickname-text');
        function typeNickname() {
            if (nickIndex < nicknameText.length) {
                nicknameEl.textContent += nicknameText.charAt(nickIndex);
                nickIndex++;
                setTimeout(typeNickname, 100);
            } else {
                setTimeout(() => nicknameEl.classList.remove('nickname-typing'), 1500);
            }
        }

        const bioText = "too lazy to learn programming.";
        let index = 0;
        const typingEl = document.getElementById('typing-text');
        function typeBio() {
            if (index < bioText.length) {
                typingEl.textContent += bioText.charAt(index);
                index++;
                setTimeout(typeBio, 35);
            }
        }

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const seekSlider = document.getElementById('seek-slider');
        const currentTimeEl = document.getElementById('current-time');
        const durationTimeEl = document.getElementById('duration-time');
        const ringProgress = document.getElementById('ring-progress');

        const RING_CIRCUMFERENCE = 131.95;
        ringProgress.style.strokeDasharray = RING_CIRCUMFERENCE;
        ringProgress.style.strokeDashoffset = RING_CIRCUMFERENCE;

        let isDraggingSlider = false;

        function toggleAudio() {
            if (audio.paused) {
                audio.play().then(() => {
                    playIcon.className = 'fa-solid fa-pause text-xs';
                }).catch(() => {});
            } else {
                audio.pause();
                playIcon.className = 'fa-solid fa-play text-xs ml-0.5';
            }
        }

        playBtn.addEventListener('click', toggleAudio);

        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isDraggingSlider) {
                const progress = audio.currentTime / audio.duration;
                const value = progress * 100;
                seekSlider.value = value;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationTimeEl.textContent = formatTime(audio.duration);

                const offset = RING_CIRCUMFERENCE * (1 - progress);
                ringProgress.style.strokeDashoffset = offset;
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            durationTimeEl.textContent = formatTime(audio.duration);
        });

        seekSlider.addEventListener('input', () => {
            isDraggingSlider = true;
            if (audio.duration) {
                const previewTime = (seekSlider.value / 100) * audio.duration;
                currentTimeEl.textContent = formatTime(previewTime);
                const offset = RING_CIRCUMFERENCE * (1 - seekSlider.value / 100);
                ringProgress.style.strokeDashoffset = offset;
            }
        });

        seekSlider.addEventListener('change', () => {
            if (audio.duration) {
                audio.currentTime = (seekSlider.value / 100) * audio.duration;
            }
            isDraggingSlider = false;
        });

        const splashScreen = document.getElementById('splash-screen');
        function handleEnter() {
            splashScreen.classList.add('fade-out');
            audio.currentTime = 0;
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    playIcon.className = 'fa-solid fa-pause text-xs';
                }).catch(e => console.log('Autoplay prevented:', e));
            }
            setTimeout(typeNickname, 200);
            setTimeout(typeBio, 800);
        }
        splashScreen.addEventListener('pointerdown', handleEnter, { once: true });

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            toast.classList.remove('-translate-y-12', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-12', 'opacity-0');
            }, 2200);
        }

        function copyDiscordTag(tag) {
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(tag).then(() => {
                    showToast(`Copied @${tag}`);
                }).catch(() => {
                    fallbackCopy(tag);
                });
            } else {
                fallbackCopy(tag);
            }
        }

        function fallbackCopy(text) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast(`Copied @${text}`);
        }

        const DISCORD_USER_ID = "1549111934392209601";

        const activityDetail = document.getElementById('activity-detail');
        const discordStatusTitle = document.getElementById('discord-status-title');
        const discordCardAvatar = document.getElementById('discord-card-avatar');
        const discordDecoration = document.getElementById('discord-avatar-decoration');
        const discordCardStatus = document.getElementById('discord-card-status');
        const discordGlobalName = document.getElementById('discord-global-name');

        let currentStatus = null;

        function getStatusSvg(status) {
            if (status === 'online') {
                return `<svg viewBox="0 0 16 16" class="w-full h-full"><circle cx="8" cy="8" r="7" fill="#23a55a"/></svg>`;
            } else if (status === 'idle') {
                return `<svg viewBox="0 0 16 16" class="w-full h-full"><path fill="#f0b232" d="M12.42 10.42a6 6 0 1 1-6.84-8.34 7 7 0 1 0 6.84 8.34z"/></svg>`;
            } else if (status === 'dnd') {
                return `<svg viewBox="0 0 16 16" class="w-full h-full"><circle cx="8" cy="8" r="7" fill="#f23f43"/><rect x="3.2" y="6.6" width="9.6" height="2.8" rx="1.4" fill="#ffffff"/></svg>`;
            } else if (status === 'streaming') {
                return `<svg viewBox="0 0 16 16" class="w-full h-full"><circle cx="8" cy="8" r="7" fill="#593695"/><polygon points="6,4.5 11.5,8 6,11.5" fill="#ffffff"/></svg>`;
            } else {
                return `<svg viewBox="0 0 16 16" class="w-full h-full"><circle cx="8" cy="8" r="5" fill="none" stroke="#80848e" stroke-width="3"/></svg>`;
            }
        }

        function updateDiscordPresence(data) {
            if (!data) return;

            if (data.discord_user) {
                if (data.discord_user.avatar) {
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${data.discord_user.id}/${data.discord_user.avatar}.png?size=256`;
                    discordCardAvatar.src = avatarUrl;
                }
                if (data.discord_user.avatar_decoration_data) {
                    const decoAsset = data.discord_user.avatar_decoration_data.asset;
                    discordDecoration.src = `https://cdn.discordapp.com/avatar-decoration-presets/${decoAsset}.png`;
                    discordDecoration.classList.remove('hidden');
                } else {
                    discordDecoration.classList.add('hidden');
                }

                const globalName = data.discord_user.global_name || data.discord_user.display_name || data.discord_user.username;
                if (globalName) discordGlobalName.textContent = globalName;
            }

            const clanTagEl = document.getElementById('discord-clan-tag');
            const clan = data.discord_user?.clan || data.discord_user?.primary_guild;
            if (clan && clan.tag) {
                const guildId = clan.identity_guild_id || clan.identityGuildId;
                let innerContent = '';
                if (clan.badge && guildId) {
                    const badgeUrl = `https://cdn.discordapp.com/clan-badges/${guildId}/${clan.badge}.png`;
                    innerContent += `<img src="${badgeUrl}" class="w-3 h-3 object-contain rounded-xs shrink-0" onerror="this.remove()">`;
                }
                innerContent += `<span>${clan.tag}</span>`;
                clanTagEl.innerHTML = innerContent;
                clanTagEl.classList.remove('hidden');
            } else {
                clanTagEl.classList.add('hidden');
            }

            const status = data.discord_status || 'offline';
            discordStatusTitle.textContent = status.toUpperCase();

            if (status !== currentStatus) {
                currentStatus = status;
                const oldSvg = discordCardStatus.querySelector('svg');
                if (oldSvg) {
                    oldSvg.style.opacity = '0';
                    oldSvg.style.transform = 'scale(0.6)';
                }
                setTimeout(() => {
                    discordCardStatus.innerHTML = getStatusSvg(status);
                    const newSvg = discordCardStatus.querySelector('svg');
                    if (newSvg) newSvg.classList.add('fade-in');
                }, 200);
            }

            const customStatus = data.activities?.find(a => a.type === 4);
            if (customStatus && (customStatus.state || customStatus.emoji)) {
                let statusHtml = '';
                if (customStatus.emoji) {
                    if (customStatus.emoji.id) {
                        const ext = customStatus.emoji.animated ? 'gif' : 'png';
                        statusHtml += `<img src="https://cdn.discordapp.com/emojis/${customStatus.emoji.id}.${ext}" class="w-3.5 h-3.5 inline-block mr-1 align-text-bottom">`;
                    } else if (customStatus.emoji.name) {
                        statusHtml += `${customStatus.emoji.name} `;
                    }
                }
                if (customStatus.state) statusHtml += customStatus.state;
                activityDetail.innerHTML = statusHtml;
            } else {
                activityDetail.textContent = status === 'offline' ? "Currently away" : "no status message";
            }
        }

        async function fetchLanyardREST() {
            try {
                const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
                const json = await res.json();
                if (json.success) updateDiscordPresence(json.data);
            } catch (err) {
                console.warn('Lanyard REST error:', err);
            }
        }

        function initLanyardSocket() {
            const ws = new WebSocket('wss://api.lanyard.rest/socket');
            ws.onopen = () => {
                ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: DISCORD_USER_ID } }));
            };
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.op === 1) {
                    setInterval(() => ws.send(JSON.stringify({ op: 3 })), msg.d.heartbeat_interval);
                } else if (msg.t === 'INIT_STATE' || msg.t === 'PRESENCE_UPDATE') {
                    updateDiscordPresence(msg.d);
                }
            };
            ws.onerror = () => fetchLanyardREST();
            ws.onclose = () => setTimeout(initLanyardSocket, 5000);
        }

        fetchLanyardREST();
        initLanyardSocket();
    </script>
</body>
</html>
